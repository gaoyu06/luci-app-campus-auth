<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园网状态</title>
<style>
:root { --ink: #d7e0e8; --muted: #8a98a6; --line: rgba(255, 255, 255, .11); --panel: #1c252e; --accent: #2aa198; --danger: #d96b6b; }
* { box-sizing: border-box; }
body { margin: 0; background: #141b21; color: var(--ink); font: 14px/1.5 "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 20px 14px 40px; }
h1 { margin: 0 0 14px; font-size: 20px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
.status { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: #9aa6ad; }
.dot.online { background: #159447; }
.dot.offline, .dot.failed, .dot.error { background: var(--danger); }
.sub { margin-top: 4px; color: var(--muted); font-size: 12px; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.metric span { display: block; color: var(--muted); font-size: 12px; }
.metric b { font-size: 16px; }
.actions { display: flex; gap: 10px; }
button { flex: 1; min-height: 42px; border: 1px solid var(--line); border-radius: 6px; background: rgba(0, 0, 0, .15); color: var(--ink); font-size: 15px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: wait; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; }
th { color: var(--muted); font-size: 12px; font-weight: 400; }
tr:last-child td { border-bottom: 0; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
th.num { text-align: right; }
.tag { margin-left: 6px; padding: 1px 6px; border-radius: 4px; background: rgba(42, 161, 152, .2); color: var(--accent); font-size: 11px; }
.toast { min-height: 20px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.toast.error { color: var(--danger); }
</style>
</head>
<body>
<main>
    <h1>校园网状态</h1>
    <section class="panel">
        <div class="status"><span class="dot" id="dot"></span><span id="state">读取中</span></div>
        <div class="sub" id="sub"></div>
        <div class="metrics">
            <div class="metric"><span>当前账号</span><b id="account">—</b></div>
            <div class="metric"><span>本月已用</span><b id="flow">—</b></div>
            <div class="metric"><span>余额</span><b id="fee">—</b></div>
        </div>
    </section>
    <section class="panel">
        <div class="actions">
            <button class="primary" id="login">立即登录</button>
            <button id="switch">切换账号</button>
        </div>
        <div class="toast" id="toast">掉线时点「立即登录」；切换账号会断网几秒。</div>
    </section>
    <section class="panel">
        <table>
            <thead><tr><th>账号</th><th class="num">本月已用</th><th class="num">余额</th></tr></thead>
            <tbody id="accounts"><tr><td colspan="3">读取中</td></tr></tbody>
        </table>
    </section>
</main>
<script>
var labels = { online: '在线', offline: '离线', failed: '登录失败', error: '错误', unknown: '未知', not_configured: '未配置' };

function gb(mb) {
    var n = parseFloat(mb);
    return isNaN(n) ? '—' : (n / 1024).toFixed(2) + ' GB';
}

function yuan(v) {
    return v ? v + ' 元' : '—';
}

function render(s) {
    document.getElementById('dot').className = 'dot ' + s.state;
    document.getElementById('state').textContent = labels[s.state] || s.state || '未知';
    document.getElementById('sub').textContent = (s.message || '') + (s.updated ? '，更新于 ' + s.updated : '');
    document.getElementById('account').textContent = s.state === 'online' ? s.account || '—' : '—';
    document.getElementById('flow').textContent = s.state === 'online' ? gb(s.flow) : '—';
    document.getElementById('fee').textContent = s.state === 'online' ? yuan(s.fee) : '—';
    var rows = (s.accounts || []).map(function (a) {
        return '<tr><td>' + a.user + (a.current && s.state === 'online' ? '<span class="tag">使用中</span>' : '') + '</td>'
            + '<td class="num">' + (a.flow ? gb(a.flow) : '暂无数据') + '</td>'
            + '<td class="num">' + yuan(a.fee) + '</td></tr>';
    });
    document.getElementById('accounts').innerHTML = rows.join('') || '<tr><td colspan="3">没有账号</td></tr>';
}

function toast(text, error) {
    var el = document.getElementById('toast');
    el.textContent = text;
    el.className = 'toast' + (error ? ' error' : '');
}

function refresh() {
    fetch('cgi-bin/api', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(render).catch(function () {
        toast('读取状态失败', true);
    });
}

function act(action, button, doing) {
    var buttons = document.querySelectorAll('button');
    buttons.forEach(function (b) { b.disabled = true; });
    toast(doing);
    fetch('cgi-bin/api?action=' + action, { method: 'POST' }).then(function (r) { return r.json(); }).then(function (res) {
        if (res.status) render(res.status);
        if (res.error) toast(res.error, true);
        else toast(res.ok ? '已完成，当前' + labels[res.status.state] : '操作未成功，请稍后再试', !res.ok);
    }).catch(function () {
        toast('请求失败', true);
    }).then(function () {
        buttons.forEach(function (b) { b.disabled = false; });
    });
}

document.getElementById('login').onclick = function () { act('login', this, '正在登录…'); };
document.getElementById('switch').onclick = function () { act('switch', this, '正在切换，网络会断开几秒…'); };
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
